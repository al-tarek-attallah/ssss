<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساحة للسعادة والهدوء ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* حاويات زجاجية (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin: 15px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        h1 { color: #ffb8d2; font-size: 2.2em; margin-bottom: 5px; }
        p { color: #b2bec3; font-size: 1.1em; margin-bottom: 15px; }
        h3 { color: #ffeaa7; margin-bottom: 15px; }

        /* أزرار تفاعلية */
        .btn {
            background: linear-gradient(45deg, #ff7675, #d63031);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(214, 48, 49, 0.4);
            margin: 5px;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(214, 48, 49, 0.6); }
        .btn:active { transform: translateY(1px); }
        
        .btn-music { background: linear-gradient(45deg, #0984e3, #74b9ff); box-shadow: 0 4px 15px rgba(9, 132, 227, 0.4); }

        /* جرة السعادة */
        .magic-jar {
            font-size: 4em;
            cursor: pointer;
            transition: transform 0.3s;
            user-select: none;
            display: inline-block;
        }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
            100% { transform: rotate(0deg); }
        }

        .message-box {
            font-size: 1.3em;
            color: #fff;
            min-height: 80px;
            margin-top: 15px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* فرقعة الفقاعات */
        .bubble-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            justify-items: center;
            margin-top: 15px;
        }

        .bubble {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.5);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.1s;
        }

        .bubble.popped {
            background: rgba(255,255,255,0.05);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            border: 1px dashed rgba(255,255,255,0.2);
            transform: scale(0.8);
            cursor: default;
        }

        /* النجوم المتطايرة مع الماوس */
        .star-trail {
            position: absolute;
            pointer-events: none;
            width: 15px;
            height: 15px;
            background: #ffeaa7;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffeaa7, 0 0 20px #ffeaa7;
            animation: fadeStar 0.8s forwards;
            z-index: 100;
        }
        @keyframes fadeStar {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* قلوب الحضن الافتراضي */
        .floating-heart {
            position: fixed;
            bottom: -50px;
            font-size: 2em;
            animation: floatUp 3s ease-in forwards;
            z-index: 9999;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5) rotate(45deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- موسيقى هادئة (تعمل عند الضغط) -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <div class="glass-panel" style="margin-top: 40px;">
        <h1>أهلاً بكِ هنا ✨</h1>
        <p>حركي إصبعك على الشاشة لترسمي النجوم..</p>
        <button class="btn btn-music" onclick="toggleMusic()" id="music-btn">🎵 تشغيل موسيقى هادئة</button>
    </div>

    <!-- جرة السعادة -->
    <div class="glass-panel">
        <h3>جرة السعادة 🍯</h3>
        <p>اضغطي على الجرة لتخرج لكِ رسالة</p>
        <div class="magic-jar" id="jar" onclick="openJar()">🏺</div>
        <div class="message-box" id="msg-box">أنا هنا بانتظارك!</div>
    </div>

    <!-- الحضن الافتراضي -->
    <div class="glass-panel">
        <h3>طاقة إيجابية 💖</h3>
        <p>لو حسيتي إنك محتاجة دعم، اضغطي هنا</p>
        <button class="btn" onclick="sendVirtualHug()">أرسل حضن افتراضي 🤗</button>
    </div>

    <!-- فرقعة الفقاعات بالصوت -->
    <div class="glass-panel">
        <h3>لعبة فرقعة الفقاعات 🫧</h3>
        <p>افصلي دماغك وفرقعيهم (افتحي الصوت!)</p>
        <div class="bubble-grid" id="bubbles"></div>
        <button class="btn btn-music" style="margin-top: 15px;" onclick="resetBubbles()">تجديد الفقاعات 🔄</button>
    </div>

    <script>
        // --- 1. تأثير النجوم مع حركة الماوس أو اللمس ---
        document.addEventListener('mousemove', createStar);
        document.addEventListener('touchmove', (e) => {
            createStar(e.touches[0]);
        });

        function createStar(e) {
            const star = document.createElement('div');
            star.className = 'star-trail';
            star.style.left = e.pageX + 'px';
            star.style.top = e.pageY + 'px';
            document.body.appendChild(star);
            setTimeout(() => { star.remove(); }, 800);
        }

        // --- 2. تشغيل الموسيقى ---
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerText = "🎵 تشغيل موسيقى هادئة";
            } else {
                music.volume = 0.4; // صوت هادئ
                music.play();
                musicBtn.innerText = "🔇 إيقاف الموسيقى";
            }
            isPlaying = !isPlaying;
        }

        // --- 3. جرة السعادة ---
        const messages = [
            "أنتِ قوية، جميلة، وتستحقين كل الأشياء الرائعة 🌸",
            "لا تنسي تاكلي حاجة حلوة وتكافئي نفسك.. جسمك ليه حق عليكي 🍫",
            "كل حاجة هتتظبط وتبقى كويسة، خدي نفس عميق وابتسمي ✨",
            "في ناس بتفرح لمجرد إنها بتشوفك أو بتطمن عليكي 💖",
            "مهما كان اليوم متعب، المهم إنك رجعتي بالسلامة، ارتاحي بقى 🌌",
            "ضحكتك بتنور الدنيا، متخليش أي حاجة تطفيها 😊",
            "أنتِ مش لوحدك، دايماً في حد واقف جنبك وبيدعمك 💪"
        ];

        function openJar() {
            const jar = document.getElementById('jar');
            const msgBox = document.getElementById('msg-box');
            
            jar.classList.add('shake');
            setTimeout(() => { jar.classList.remove('shake'); }, 500);

            msgBox.style.opacity = 0;
            setTimeout(() => {
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                msgBox.innerText = randomMsg;
                msgBox.style.opacity = 1;
                msgBox.style.transition = "opacity 0.5s";
            }, 300);
        }

        // --- 4. الحضن الافتراضي (قلوب متطايرة) ---
        function sendVirtualHug() {
            const emojis = ['💖', '🌸', '✨', '🤗'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.fontSize = (Math.random() * 2 + 1.5) + 'em';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => { heart.remove(); }, 3000);
                }, i * 150); // تظهر ورا بعضها
            }
        }

        // --- 5. فرقعة الفقاعات مع توليد صوت حقيقي ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // دالة لإنشاء صوت "بُوب" خفيف ومريح
        function playPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function resetBubbles() {
            const container = document.getElementById('bubbles');
            container.innerHTML = '';
            // إنشاء 24 فقاعة
            for (let i = 0; i < 24; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.onclick = function() {
                    if (!this.classList.contains('popped')) {
                        this.classList.add('popped');
                        playPopSound(); // تشغيل الصوت عند الفرقعة
                    }
                };
                container.appendChild(bubble);
            }
        }

        // تشغيل الفقاعات عند البداية
        resetBubbles();
    </script>
</body>
</html>
